# A single-package repo, but the file must declare `packages` all the same:
# pnpm 9 (which Vercel selects for this project by creation date) refuses a
# config-only workspace file with "packages field missing or empty".
packages:
  - '.'

# Dependencies whose install/postinstall scripts are allowed to run.
# pnpm blocks these by default; each one below is required for the build:
#   @prisma/client / @prisma/engines / prisma -> download engines + generate the client
#   bcrypt                                    -> fetch the prebuilt native binding
#   unrs-resolver                             -> native resolver used by eslint-config-next
#   sharp                                     -> next/image's optimizer binary
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Same list under the pnpm 10 key, so an older build image still allows these.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - bcrypt
  - prisma
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.1.1'

# Transitive security fixes.
#   deepmerge-ts <8 -> stack exhaustion on recursive graphs (GHSA-ggr8-5vv4-36mx).
#   Reached through prisma > @prisma/config, which still pins ^7.
overrides:
  deepmerge-ts: '^8.0.2'
